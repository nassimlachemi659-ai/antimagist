name: Antimagist CI Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-antimagist:
    name: Run Master Verification & Regression Suite
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pystray pillow psutil requests qrcode

      - name: Execute Antimagist Master Verification Suite
        run: |
          python test_master_v7_suite.py
